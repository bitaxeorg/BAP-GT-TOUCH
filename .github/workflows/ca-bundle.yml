name: Verify pinned CA bundle

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/test_ca_bundle.py
      - name: Install Settings contract test dependency
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Test display policies
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I main tests/test_display_schedule.c main/display_schedule.c -o "$RUNNER_TEMP/display-schedule"
          "$RUNNER_TEMP/display-schedule"
          cc -std=c11 -Wall -Wextra -Werror -I main tests/test_display_button_visibility.c main/display_button_visibility.c -o "$RUNNER_TEMP/display-button"
          "$RUNNER_TEMP/display-button"
          bash tests/test_settings_ui_contract.sh
      - name: Verify price-provider chains and build firmware with the release SDK
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.6
          target: esp32s3
          command: python tools/test_price_ca.py --idf-path "$IDF_PATH" && GITHUB_ACTIONS=true idf.py build
          path: '.'
